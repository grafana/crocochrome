name: Build and publish commit to dev

# Every commit to main is built, pushed to ghcr.io and rolled out to the dev
# waves through the deploy-crocochrome Argo workflow (synthetic-monitoring-cd).
#
# Releases are NOT handled here: v* tags are published by publish-container.yaml
# and promoted to prod by the crocochrome rollout-by-wave workflow.

permissions:
  contents: none

on:
  push:
    branches:
      - main

# Only the latest commit matters for dev. Cancel in-flight runs so a burst of
# merges doesn't queue a deploy for every intermediate commit.
concurrency:
  group: build-and-publish-main
  cancel-in-progress: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.repo.outputs.version }}
      image: ${{ steps.repo.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Needed for the version script to work.
          persist-credentials: false

      # scripts/version is both the image tag and, through the Makefile (-ldflags), the version the binary reports in
      # sm_crocochrome_info{version}. The rollout check in deploy-crocochrome matches the tag against that label, so
      # they must stay the same string.
      - name: Compute repo metadata
        id: repo
        run: |-
          version="$(./scripts/version)"
          # Without tags, scripts/version falls back to the bare commit hash, which the Makefile ignores, so the binary
          # would report a different version than the tag we are about to push.
          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || [[ "${version}" == *-dirty ]]; then
            echo "unexpected version '${version}': the checkout needs full history, including tags, and a clean tree" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY}:${version}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false # https://woodruffw.github.io/zizmor/audits/#cache-poisoning
      - name: Log into ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: . # Use checked out repo with full history, instead of letting build making a shallow clone.
          tags: |-
            ${{ steps.repo.outputs.image }}
          push: true
          platforms: linux/amd64,linux/arm64

  deploy:
    name: deploy
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The following two steps are needed because trigger-argo-workflow is
      # calling setup-go *after* setup-argo, and setup-argo actually needs go
      # to obtain GOOS and GOARCH (because it's downloading a remote tarball
      # where those values are part of the filename).
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod

      - name: Trigger argo workflow
        uses: grafana/shared-workflows/actions/trigger-argo-workflow@5a212d56e9d224851dc4b3c2643bbc5bac484d5d # trigger-argo-workflow/v2.0
        with:
          namespace: synthetic-monitoring-cd
          workflow_template: deploy-crocochrome
          extra_args: "--generate-name deploy-crocochrome-"
          parameters: |
            image=${{ needs.publish.outputs.image }}
            dockertag=${{ needs.publish.outputs.version }}
            commit=${{ github.sha }}
            commit_author=${{ github.actor }}
            commit_link=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
